name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # Reads PR metadata through the API only. Nothing from the PR branch is
      # checked out or executed here: pull_request_target runs with a write
      # token against the base repo, so running PR code would be exploitable.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Security updates only (ghsa-id is empty for plain version updates), and
      # never a major: those need a human, like the @hono/node-server 1.x -> 2.x
      # bump that had to be reasoned about before landing.
      - name: Enable auto-merge
        if: |
          steps.meta.outputs.ghsa-id != '' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
